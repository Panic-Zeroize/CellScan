name: Core tests

# Compiles and stress-tests CellScan's platform-independent core
# (CellScan/Core: model, cell merging, CSV export, persistence) on Linux.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings as errors)
        run: swift build --build-tests -Xswiftc -warnings-as-errors
      - name: Swift 6 strict-concurrency check
        run: swift build --build-path .build-swift6 -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test
      - name: Test under ThreadSanitizer
        run: swift test --build-path .build-tsan --sanitize=thread --skip Performance

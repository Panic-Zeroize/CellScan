name: CI

on:
  push:
  pull_request:

jobs:
  # Compiles the full iOS app (every SwiftUI screen) with Xcode — no signing needed.
  ios-app-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build CellScan for iOS Simulator (Debug)
        run: |
          set -o pipefail
          xcodebuild -project CellScan.xcodeproj -target CellScan -configuration Debug \
            -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-debug.log
      - name: Build CellScan for iOS device (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project CellScan.xcodeproj -target CellScan -configuration Release \
            -sdk iphoneos CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-release.log
      - name: Report compiler warnings in project sources
        run: |
          grep -h -E "/CellScan/.*\.swift:[0-9]+:[0-9]+: warning:" build-*.log | sort -u || echo "No warnings"
      - name: Check generated Info.plist
        run: |
          plist=$(find build -name Info.plist -path "*CellScan.app/Info.plist" | head -1)
          echo "$plist"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$plist"
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$plist"
          /usr/libexec/PlistBuddy -c "Print :UIFileSharingEnabled" "$plist"
      - name: Core tests on macOS (Apple Foundation)
        run: swift test

  # Runs the real app end to end in the iOS Simulator: location permission,
  # a simulated drive, background recording, live speed probes, save, CSV.
  ios-simulator-e2e:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      BUNDLE_ID: com.cellscan.CellScan
    steps:
      - uses: actions/checkout@v4
      - name: Build Debug app for the simulator
        run: |
          set -o pipefail
          xcodebuild -project CellScan.xcodeproj -target CellScan -configuration Debug \
            -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -3
      - name: Boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for rt, ds in sorted(devs.items(), reverse=True) if "iOS" in rt
                     for d in ds if d["name"].startswith("iPhone")))')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Install app, grant location, start a simulated drive
        run: |
          xcrun simctl install "$UDID" build/Debug-iphonesimulator/CellScan.app
          xcrun simctl privacy "$UDID" grant location-always "$BUNDLE_ID"
          # ~25 m/s along a route in Cupertino, one fix per second.
          xcrun simctl location "$UDID" start --speed=25 --interval=1 \
            37.3317,-122.0307 37.3365,-122.0230 37.3420,-122.0150 37.3480,-122.0080 37.3550,-122.0010
      - name: Record a pass (foreground, then background)
        run: |
          mkdir -p e2e-artifacts
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -smokeTest 75
          sleep 20
          xcrun simctl io "$UDID" screenshot e2e-artifacts/1-recording.png
          # Send CellScan to the background mid-drive by opening Settings.
          xcrun simctl launch "$UDID" com.apple.Preferences
          sleep 10
          xcrun simctl io "$UDID" screenshot e2e-artifacts/2-backgrounded.png
      - name: Wait for the smoke result
        run: |
          for i in $(seq 1 60); do
            DOCS="$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)/Documents"
            [ -f "$DOCS/smoke-result.json" ] && break
            sleep 5
          done
          echo "DOCS=$DOCS" >> "$GITHUB_ENV"
          ls -la "$DOCS"
          cp "$DOCS"/smoke-result.json "$DOCS"/smoke.csv "$DOCS"/passes.json e2e-artifacts/
      - name: Verify recording, persistence and export
        run: python3 Tests/e2e/verify_smoke.py "$DOCS"
      - name: Relaunch and check the saved pass appears
        run: |
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 8
          xcrun simctl io "$UDID" screenshot e2e-artifacts/3-home-after-relaunch.png
      - name: Fail on any CellScan crash report
        run: |
          crashes=$(find ~/Library/Logs/DiagnosticReports -name "CellScan*" 2>/dev/null)
          if [ -n "$crashes" ]; then echo "$crashes"; cat $crashes | head -80; exit 1; fi
          echo "No crash reports"
      - name: App log (on failure)
        if: failure()
        run: xcrun simctl spawn "$UDID" log show --last 10m --predicate 'process == "CellScan"' | tail -200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: e2e-artifacts

  # Compiles and stress-tests the platform-independent core on Linux.
  core-linux:
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings as errors)
        run: swift build --build-tests -Xswiftc -warnings-as-errors
      - name: Swift 6 strict-concurrency check
        run: swift build --build-path .build-swift6 -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test
      - name: Test under ThreadSanitizer
        run: swift test --build-path .build-tsan --sanitize=thread --skip Performance
      - name: AddressSanitizer + LeakSanitizer (fails on any leak from CellScan code)
        run: Tests/check-leaks.sh
